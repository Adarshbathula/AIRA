services:
  - type: web
    name: aira
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.deploy
    healthCheckPath: /api/health

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@aira.test

      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      - key: BOOTSTRAP_USER_EMAIL
        value: engineer@aira.test

      - key: BOOTSTRAP_USER_PASSWORD
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: LLM_ENABLED
        value: auto